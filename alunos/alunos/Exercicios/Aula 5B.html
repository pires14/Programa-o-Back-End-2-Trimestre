<!--
Crie um objeto chamado carro com a propriedade combustivel iniciando em 20. 
Crie um método chamado adicionarGasolina(litros) que recebe a quantidade digitada 
e soma no tanque atual. Capture o valor digitado pelo usuário e passe para o método 
do seu objeto.
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>5B - Exercício: Combustível</title>
</head>

<body>
    
    <h2>Exercício 5B: Tanque de Combustível</h2>
    <p>Gasolina no Tanque: <span id="txtGasolina">20</span> Litros</p>

    <input type="number" id="valGasolina" placeholder="Quantos litros?"><br>
    <input type="number" id="tiraGasolina" placeholder="Quantos litros para tirar?"><br>
    <button onclick="executarAbastecimento()">Abastecer</button>
    <button onclick="gastarGasolina()">Gastar</button>

    <script>
       const carro = {
        combustivel: 20,
        adicionarGasolina: function(litrosAdicionados){
            this.combustivel += litrosAdicionados;
            return this.combustivel;},
        gastarGasolina: function(litrosTirados){
            this.combustivel -= litrosTirados;
            return this.combustivel;
        }

        }
       
       function executarAbastecimento(){
        let inputCombustivel = Number(document.getElementById('valGasolina').value);
        carro.adicionarGasolina(inputCombustivel);
        document.getElementById('txtGasolina').innerHTML = carro.combustivel;
       }
       function gastarGasolina(){
        let inputGastar = Number(document.getElementById('tiraGasolina').value);
        carro.gastarGasolina(inputGastar);
        document.getElementById('txtGasolina').innerHTML = carro.combustivel
       }
    </script>
</body>
</html>
